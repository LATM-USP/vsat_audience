<!doctype html>
<html lang="en">
    <head>
        <title>Pd4Web_Original_Patch</title>
        <meta charset="UTF-8" />
        <!-- WebApp manifest -->
        <link rel="manifest" href="manifest.json" />
        <meta name="theme-color" content="#000000" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="apple-touch-icon" href="icon-192.png" />
        <meta name="mobile-web-app-capable" content="yes" />
        <!-- Always BEFORE pd4web.js (it update COI) -->
        <script src="./pd4web.threads.js"></script>
        <script src="https://aframe.io/releases/1.7.0/aframe.min.js" crossorigin="anonymous"></script>
        <!-- Main modules -->

        <!-- <script src="./pd4web.js"></script> -->
        <script src="./pd4web.js"></script>
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
        <style>
            @media (prefers-color-scheme: light) {
                :root {
                    --bg: rgb(255, 255, 255);
                    --fg: rgb(0, 0, 0, 0.9);
                }
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: rgb(48, 48, 48);
                    --fg: rgb(255, 255, 255, 0.9);

                    .pd4web-sound-switch {
                        filter: invert(1);
                    }
                }
            }

            body {
                font-size: 10px;
                touch-action: pan-x pan-y;
                background-color: var(--bg);
            }

            span {
                color: blue;
            }

            #audio-loader {
                position: fixed;
                top: 10px;
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                width: 220px;
                padding: 8px;
                border-radius: 5px;
                background-color: rgba(0, 0, 0, 0.05);
                box-shadow:
                    rgba(14, 30, 37, 0.12) 0px 2px 4px 0px,
                    rgba(14, 30, 37, 0.32) 0px 2px 16px 0px;
                z-index: 9999;
            }

            #audio-loader.hidden {
                display: none;
            }

            #audio-loader.ready #audio-progress {
                display: none;
            }

            #audio-status {
                font-size: 10px;
                text-align: center;
                margin-bottom: 4px;
                color: var(--fg);
            }

            #audio-progress {
                width: 150px;
                height: 8px;
                border-radius: 4px;
            }

            .pd4web-patch-canvas {
                tabindex: 0;
                margin: 10px auto;
                display: flex;
                border-radius: 5px;
                box-shadow:
                    rgba(14, 30, 37, 0.12) 0px 2px 4px 0px,
                    rgba(14, 30, 37, 0.32) 0px 2px 16px 0px;
            }

            .pd4web-patch-canvas:focus {
                box-shadow:
                    rgba(100, 30, 37, 0.12) 0px 2px 4px 0px,
                    rgba(100, 30, 37, 0.32) 0px 2px 16px 0px;
            }

            .pd4web-sound-switch {
                display: flex;
                justify-content: center;
                align-items: center;
                width: 25px;
                height: 25px;
                margin: 0 auto;
                transform: none;
            }

            /* Animation */
            @keyframes spin {
                0% {
                    transform: rotate(0deg);
                }
                100% {
                    transform: rotate(360deg);
                }
            }

            @keyframes pulse {
                0% {
                    transform: scale(1);
                }
                50% {
                    transform: scale(1.2);
                }
                100% {
                    transform: scale(1);
                }
            }
            .pulse-icon {
                animation: pulse 1s infinite;
            }
        </style>
    </head>
    <body>
        <a-scene>
            <!-- Audio is loaded by Pd4Web via sendFile; do not preload here (136MB file). -->
            <a-sky src="Untitled.jpeg"></a-sky>
            <!-- câmera com look-controls -->
            <a-camera fov="80" id="playerCam" look-controls position="0 0 0">
                <a-sphere id="targetSphere" color="green" radius="0.005" position="0 0 -1"></a-sphere>
            </a-camera>

            <a-entity geometry="primitive: sphere" radius="0.005" material="color: red" position="0 10 -10"></a-entity>
            <a-entity geometry="primitive: sphere" radius="0.005" material="color: blue" position="0 1 0"></a-entity>
            <a-entity geometry="primitive: sphere" radius="0.005" material="color: yellow" position="0 0 1"></a-entity>
        </a-scene>

        <div id="audio-loader">
            <span id="audio-status">Loading audio…</span>
            <progress id="audio-progress" value="0" max="100"></progress>
        </div>

        <!-- All the styles are in the pd4web.style.css -->
        <span class="pd4web-sound-switch" id="Pd4WebAudioSwitch"></span>
        <script>
            var Pd4Web = null;

            const AUDIO_FILE = "./esquerda.wav";
            const audioLoader = document.getElementById("audio-loader");
            const audioStatus = document.getElementById("audio-status");
            const audioProgress = document.getElementById("audio-progress");
            let audioReady = null;

            function preloadAudio(url) {
                return new Promise((resolve, reject) => {
                    const xhr = new XMLHttpRequest();
                    xhr.open("GET", url, true);
                    xhr.responseType = "arraybuffer";

                    xhr.onprogress = (event) => {
                        if (event.lengthComputable) {
                            const percent = Math.floor((event.loaded / event.total) * 100);
                            audioProgress.value = percent;
                            const mb = (event.loaded / 1024 / 1024).toFixed(1);
                            const totalMb = (event.total / 1024 / 1024).toFixed(1);
                            audioStatus.textContent = `Loading audio… ${percent}% (${mb}/${totalMb} MB)`;
                        } else {
                            const mb = (event.loaded / 1024 / 1024).toFixed(1);
                            audioStatus.textContent = `Loading audio… ${mb} MB`;
                        }
                    };

                    xhr.onload = () => {
                        if (xhr.status === 200) {
                            audioProgress.value = 100;
                            audioLoader.classList.add("ready");
                            audioStatus.textContent = "Audio ready — click anywhere to play";
                            resolve(new Uint8Array(xhr.response));
                        } else {
                            reject(new Error(`Failed to load ${url}, status ${xhr.status}`));
                        }
                    };

                    xhr.onerror = () => reject(new Error(`Network error loading ${url}`));
                    xhr.send();
                });
            }

            audioReady = preloadAudio(AUDIO_FILE).catch((err) => {
                console.error("Audio preload failed:", err);
                audioStatus.textContent = "Failed to load audio";
                audioProgress.style.display = "none";
                audioReady = null;
            });

            Pd4WebModule().then((Pd4WebModulePromise) => {
                Pd4Web = new Pd4WebModulePromise.Pd4Web();
                Pd4Web.openPatch("index.pd", {
                    renderGui: false,
                });

                // Override patch defaults (delta=180 forces region to 0) before any ori_rcv.
                Pd4Web.sendSymbol("alfa", "0");
                Pd4Web.sendSymbol("delta", "90");
                Pd4Web.sendSymbol("vol1", "1");
                Pd4Web.sendSymbol("vol2", "1");
                Pd4Web.sendSymbol("fcut1", "16000");
                Pd4Web.sendSymbol("fcut2", "16000");

                document.addEventListener(
                    "click",
                    async () => {
                        Pd4Web.init();

                        audioStatus.textContent = "Preparing audio…";
                        audioProgress.style.display = "none";

                        const uint8 = await audioReady;
                        if (!uint8) {
                            audioStatus.textContent = "Failed to load audio";
                            return;
                        }

                        // sendFile copies into WASM FS; yield so the UI can paint first.
                        await new Promise((r) => setTimeout(r, 0));
                        Pd4Web.sendFile(uint8, AUDIO_FILE);

                        audioLoader.classList.add("hidden");

                        Pd4Web.sendSymbol("NewPathTosnd1", AUDIO_FILE);
                        Pd4Web.sendBang("pplaysnd1");
                    },
                    { once: true },
                );

                Pd4Web.onBangReceived("snd1played", (r) => {
                    // logica aframe para tocar denovo
                    console.log("Som tocado novamente");
                    //Pd4Web.sendBang("pplaysnd1");
                });
            });

            AFRAME.registerComponent("watch-transform", {
                schema: {
                    eps: { type: "number", default: 0.0008 },
                },
                init: function () {
                    this.position = new THREE.Vector3();
                    this.lastSent = new THREE.Vector3();
                    this.hasSent = false;
                },
                tick: function () {
                    if (!Pd4Web) return;

                    this.el.object3D.getWorldPosition(this.position);
                    if (this.hasSent && this.position.distanceTo(this.lastSent) < this.data.eps) {
                        return;
                    }

                    this.lastSent.copy(this.position);
                    this.hasSent = true;
                    Pd4Web.sendList("ori_rcv", [
                        this.position.y,
                        this.position.z,
                        this.position.x,
                    ]);
                },
            });

            // espera a cena carregar e então anexa o componente na câmera
            window.addEventListener("load", () => {
                const scene = document.querySelector("a-scene");
                if (!scene.hasLoaded) {
                    scene.addEventListener("loaded", attachWatcher);
                } else {
                    attachWatcher();
                }
                function attachWatcher() {
                    const cam = document.getElementById("targetSphere");
                    // sensibilidade
                    cam.setAttribute("watch-transform", "eps: 0.0008");
                }
                async function loadRemoteAudio(url) {
                    // cloudinary
                    const res = await fetch(url);
                    if (!res.ok) throw new Error("Failed to download audio");
                    const arrayBuffer = await res.arrayBuffer();
                    const fileName = url.split("/").pop();
                    const uint8 = new Uint8Array(arrayBuffer);
                    /*if (Pd4Web){
                            Pd4Web.sendFile(uint8, fileName);
                            //Pd4Web.sendSymbol("NewPathTosnd1", "sample.wav");
                            //Pd4Web.sendBang("pplaysnd1");
                            console.log("OK:", fileName, uint8.byteLength);
                        }*/
                }
                //loadRemoteAudio("sample.wav");
            });
        </script>
    </body>
</html>
